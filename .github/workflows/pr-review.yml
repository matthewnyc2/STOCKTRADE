name: PR Review Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  trigger-reviews:
    name: Trigger AI Reviews
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Trigger GitHub Copilot Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const hasCopilotComment = comments.some(comment =>
              comment.body.includes('@copilot') &&
              comment.user.type === 'Bot'
            );

            if (!hasCopilotComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '@copilot please review this pull request for code quality, security issues, and best practices.'
              });
            }

      - name: Trigger Amazon Q Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const hasQComment = comments.some(comment =>
              comment.body.includes('/q') &&
              comment.user.type === 'Bot'
            );

            if (!hasQComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '/q review this pull request for code quality, security vulnerabilities, and potential issues.'
              });
            }

      - name: Comment Review Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔍 PR Review Triggered

              **Automated reviews have been requested:**
              - ✅ @copilot - GitHub Copilot review requested
              - ✅ /q - Amazon Q review requested

              **Next Steps:**
              1. Wait for AI reviews to complete
              2. Address any issues found
              3. Ensure all CI checks pass before merging

              ---
              *This comment was automatically created by the PR Review Automation workflow*`
            });

  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
        continue-on-error: true

      - name: Run API tests
        run: pytest tests/test_api*.py -v
        continue-on-error: true

      - name: Run service tests
        run: pytest tests/ -k "test_backtest or test_strategy or test_market" -v
        continue-on-error: true

      - name: Comment test results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '⚠️';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${emoji} Test Results

              **Status:** ${status}

              Tests have been run as part of the CI/CD pipeline. Check the "Actions" tab for detailed logs.

              ---
              *Automated test results*`
            });

  code-quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Run Ruff linter
        run: ruff check api/ core/ services/ models/ --output-format=github
        continue-on-error: true

      - name: Check formatting with Black
        run: black --check api/ core/ services/ models/
        continue-on-error: true

      - name: Type check with mypy
        run: mypy api/ --ignore-missing-imports
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r api/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  review-gap-check:
    name: Check for Review Gaps
    runs-on: ubuntu-latest
    needs: [trigger-reviews, run-tests]

    steps:
      - name: Wait for reviews
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Check if PR has reviews from required sources
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const hasCopilotReview = reviews.some(r => r.user.login.includes('copilot')) ||
                                     comments.some(c => c.body.includes('copilot'));
            const hasQReview = reviews.some(r => r.user.login.includes('amazon-q')) ||
                              comments.some(c => c.body.includes('Amazon Q'));

            if (!hasCopilotReview && !hasQReview) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## ⚠️ Review Gap Detected

              Neither Copilot nor Amazon Q have reviewed this PR yet.

              **Manual Actions:**
              - Comment @copilot to trigger GitHub Copilot review
              - Comment /q to trigger Amazon Q review

              ---
              *This is an automated reminder*`
              });
            }
