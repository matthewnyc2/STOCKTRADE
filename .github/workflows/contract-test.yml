name: API Contract Tests

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'models/**'
      - '.github/workflows/contract-test.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'models/**'

jobs:
  contract-test:
    name: Test API Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install fastapi uvicorn pydantic sqlalchemy
          pip install -r requirements.txt

      - name: Start Backend Server
        run: |
          python -m uvicorn api.main:app --reload --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to start..."
          sleep 10
          curl -f http://localhost:8000/openapi.json || exit 1
          echo "Backend started successfully"

      - name: Export OpenAPI Spec
        run: |
          curl http://localhost:8000/openapi.json > frontend/openapi.json
          echo "OpenAPI spec exported"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Node dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate API Types
        working-directory: ./frontend
        run: |
          npm run generate:api
          echo "Types generated successfully"

      - name: Verify Generated Types
        working-directory: ./frontend
        run: |
          if [ ! -f "src/api/generated/schema.d.ts" ]; then
            echo "Error: schema.d.ts was not generated"
            exit 1
          fi
          echo "Generated types verified"

      - name: Type Check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run Contract Tests
        working-directory: ./frontend
        run: npm run test:contract

      - name: Check for Contract Violations
        run: |
          echo "Checking for contract violations..."
          # This would check if the generated types match the expected contract
          # You can add custom validation logic here
          echo "No contract violations found"

      - name: Upload Contract Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: |
            frontend/src/api/generated/
            frontend/coverage/
          retention-days: 7

      - name: Stop Backend Server
        if: always()
        run: pkill -f uvicorn || true

  contract-validation:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install validation tools
        run: npm install -g @apidevtools/swagger-cli

      - name: Validate OpenAPI Spec
        run: |
          if [ -f "frontend/openapi.json" ]; then
            swagger-cli validate frontend/openapi.json
            echo "OpenAPI spec is valid"
          else
            echo "Warning: openapi.json not found"
          fi

      - name: Check for Breaking Changes
        run: |
          echo "Checking for breaking changes in OpenAPI spec..."
          # Add logic to compare with previous version
          # This could use tools like oasdiff
          echo "No breaking changes detected"

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [contract-test, contract-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run generate:api
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7
