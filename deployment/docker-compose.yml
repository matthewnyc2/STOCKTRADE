version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - stocktrade-network

  # Placeholder for backend service
  backend:
    image: stocktrade-backend:latest
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/stocktrade
    networks:
      - stocktrade-network
    depends_on:
      - db

  # Database service (placeholder)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: stocktrade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stocktrade-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stocktrade-network

volumes:
  postgres_data:
  redis_data:

networks:
  stocktrade-network:
    driver: bridge