apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: crypto-quant-lab
type: Opaque
stringData:
  # Database Credentials
  DB_NAME: "crypto_quant_prod"
  DB_USER: "crypto_user"
  DB_PASSWORD: "change-this-password-in-production"
  DATABASE_URL: "postgresql+asyncpg://crypto_user:change-this-password-in-production@database:5432/crypto_quant_prod"

  # Redis Configuration
  REDIS_URL: "redis://redis:6379/0"
  REDIS_PASSWORD: "change-this-redis-password-in-production"

  # Security
  API_KEY: "change-this-api-key-in-production"
  JWT_SECRET_KEY: "change-this-jwt-secret-key-in-production-at-least-32-characters-long"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRY_MINUTES: "1440"

  # Rate Limiting
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"

  # Monitoring
  SENTRY_DSN: ""
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"

  # Email Configuration (if needed)
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USER: "your-email@gmail.com"
  EMAIL_PASSWORD: "your-app-password"
  EMAIL_FROM: "noreply@cryptoquant.com"

---
# SSL Certificate Secret (create with: kubectl create secret tls ssl-certs --key=key.pem --cert=cert.pem -n crypto-quant-lab)
# This is a placeholder for the actual secret
apiVersion: v1
kind: Secret
metadata:
  name: ssl-certs
  namespace: crypto-quant-lab
type: kubernetes.io/tls
data:
  # Note: Base64 encode your certificate and private key
  # tls.crt: base64-encoded-cert.pem
  # tls.key: base64-encoded-key.pem