apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: crypto-quant-lab
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: redis
      component: cache
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      # Service Account
      serviceAccountName: crypto-quant-lab-sa

      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP

        # Environment Variables
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD

        # Command to start Redis with password and persistence
        command:
        - redis-server
        - --appendonly yes
        - --requirepass
        - $(REDIS_PASSWORD)
        - --maxmemory 512mb
        - --maxmemory-policy allkeys-lru
        - --save 900 1
        - --save 300 10
        - --save 60 10000

        # Resource Requirements
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Health Check
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - auth
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # Security Context
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false

        # Volume Mounts
        volumeMounts:
        - name: redis-storage
          mountPath: /data

      # Volumes
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-storage

      # Affinity (co-locate with other services)
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: app
                operator: In
                values:
                - backend

      # Tolerations
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "cache"
        effect: "NoSchedule"