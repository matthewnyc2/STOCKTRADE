[project]
name = "phoenix-conductor"
version = "0.1.0"
description = "Phoenix Conductor MCP Server - TDD orchestration for editing existing code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
]

[project.scripts]
phoenix-conductor = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
